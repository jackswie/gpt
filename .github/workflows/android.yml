
name: Glass Lock - Diagnose & Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== ROOT DIRECTORY ==="
          pwd
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 5 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle :app:assembleDebug
          elif [ -f iPadOS27LockCompanion/settings.gradle.kts ]; then
            cd iPadOS27LockCompanion
            gradle :app:assembleDebug
          else
            echo "Gradle project not found in expected locations."
            exit 1
          fi
